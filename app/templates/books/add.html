{% extends "base.html" %}

{% block title %}Add Book{% endblock %}

{% block content %}

<div class="dashboard-container book-form-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <div class="dashboard-page-header">

        <div>

            <!-- <span class="dashboard-eyebrow">
                LIBRARY
            </span> -->

            <h1>Add a new book</h1>

        </div>


        <a
            href="{{ url_for('books.list_books') }}"
            class="btn btn-light"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Books
        </a>

    </div>


    <!-- =====================================================
         FORM WORKSPACE
    ====================================================== -->

    <div class="book-form-workspace">


        <!-- =================================================
             MAIN FORM
        ================================================== -->

        <div class="card book-form-panel">

            <div class="book-form-panel-header">

                <div class="book-form-panel-icon">
                    <i class="bi bi-book"></i>
                </div>

                <div>

                    <h2>Book Information</h2>

                </div>

            </div>


            <form
                method="POST"
                class="book-form"
            >

                <!-- =================================================
                     BASIC INFORMATION
                ================================================== -->

                <div class="book-form-section">

                    <div class="book-section-heading">

                        <div class="book-section-number">
                            01
                        </div>

                        <div>

                            <h3>Basic Information</h3>

                        </div>

                    </div>


                    <div class="book-form-grid">


                        <!-- Book Code -->

                        <div class="book-form-group">

                            <label
                                for="book_code"
                                class="book-form-label"
                            >
                                Book Code
                                <span>*</span>
                            </label>


                            <div class="book-input-wrapper">

                                <i class="bi bi-upc-scan"></i>

                                <input
                                    type="text"
                                    class="book-input"
                                    id="book_code"
                                    name="book_code"
                                    placeholder="e.g. BK001"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Title -->

                        <div class="book-form-group">

                            <label
                                for="title"
                                class="book-form-label"
                            >
                                Title
                                <span>*</span>
                            </label>


                            <div class="book-input-wrapper">

                                <i class="bi bi-book"></i>

                                <input
                                    type="text"
                                    class="book-input"
                                    id="title"
                                    name="title"
                                    placeholder="Enter book title"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Author -->

                        <div class="book-form-group">

                            <label
                                for="author"
                                class="book-form-label"
                            >
                                Author
                            </label>


                            <div class="book-input-wrapper">

                                <i class="bi bi-person"></i>

                                <input
                                    type="text"
                                    class="book-input"
                                    id="author"
                                    name="author"
                                    placeholder="Enter author name"
                                >

                            </div>

                        </div>


                        <!-- Publisher -->

                        <div class="book-form-group">

                            <label
                                for="publisher"
                                class="book-form-label"
                            >
                                Publisher
                            </label>


                            <div class="book-input-wrapper">

                                <i class="bi bi-building"></i>

                                <input
                                    type="text"
                                    class="book-input"
                                    id="publisher"
                                    name="publisher"
                                    placeholder="Enter publisher"
                                >

                            </div>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     CLASSIFICATION
                ================================================== -->

                <div class="book-form-section">

                    <div class="book-section-heading">

                        <div class="book-section-number">
                            02
                        </div>

                        <div>

                            <h3>Classification & Identification</h3>

                        </div>

                    </div>


                    <div class="book-form-grid">


                        <!-- Category -->

                        <div class="book-form-group">

                            <label
                                for="category"
                                class="book-form-label"
                            >
                                Category
                            </label>


                            <div class="book-input-wrapper">

                                <i class="bi bi-tags"></i>

                                <input
                                    type="text"
                                    class="book-input"
                                    id="category"
                                    name="category"
                                    placeholder="e.g. Computer Science"
                                >

                            </div>

                        </div>


                        <!-- ISBN -->

                        <div class="book-form-group">

                            <label
                                for="isbn"
                                class="book-form-label"
                            >
                                ISBN
                            </label>


                            <div class="book-input-wrapper">

                                <i class="bi bi-upc"></i>

                                <input
                                    type="text"
                                    class="book-input"
                                    id="isbn"
                                    name="isbn"
                                    placeholder="Enter ISBN"
                                >

                            </div>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     INVENTORY
                ================================================== -->

                <div class="book-form-section">

                    <div class="book-section-heading">

                        <div class="book-section-number">
                            03
                        </div>

                        <div>

                            <h3>Inventory</h3>

                        </div>

                    </div>


                    <div class="book-inventory-field">

                        <label
                            for="total_copies"
                            class="book-form-label"
                        >
                            Total Copies
                            <span>*</span>
                        </label>


                        <div class="book-input-wrapper">

                            <i class="bi bi-stack"></i>

                            <input
                                type="number"
                                class="book-input"
                                id="total_copies"
                                name="total_copies"
                                value="1"
                                min="1"
                                placeholder="1"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     ACTIONS
                ================================================== -->

                <div class="book-form-actions">

                    <a
                        href="{{ url_for('books.list_books') }}"
                        class="btn btn-light book-cancel-button"
                    >
                        Cancel
                    </a>


                    <button
                        type="submit"
                        class="btn btn-primary book-submit-button"
                    >
                        <i class="bi bi-check-circle"></i>
                        Save Book
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
